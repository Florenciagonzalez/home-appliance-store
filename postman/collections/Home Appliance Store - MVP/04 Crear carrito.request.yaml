$kind: http-request
url: "{{shopcartUrl}}/api/shopcarts"
method: POST
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 201", () => pm.response.to.have.status(201));
      if (pm.response.code === 201) pm.collectionVariables.set("cartId", pm.response.json().id);
    language: text/javascript
order: 4000
