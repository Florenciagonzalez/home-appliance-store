$kind: http-request
url: "{{productsUrl}}/api/products"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: '{"name": "Invalido", "brand": "Demo", "unit_price": -1}'
scripts:
  - type: afterResponse
    code: pm.test("HTTP 400", () => pm.response.to.have.status(400));
    language: text/javascript
order: 3000
