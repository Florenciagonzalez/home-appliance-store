$kind: http-request
url: "{{shopcartUrl}}/api/shopcarts/{{cartId}}/addProduct"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: '{"id_product": {{productId}}, "quantity": 2}'
scripts:
  - type: afterResponse
    code: pm.test("HTTP 200", () => pm.response.to.have.status(200));
    language: text/javascript
order: 8000
