$kind: http-request
url: "{{shopcartUrl}}/api/shopcarts/{{cartId}}/addProduct"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: '{"id_product": {{productId}}, "quantity": -1}'
scripts:
  - type: afterResponse
    code: pm.test("HTTP 400", () => pm.response.to.have.status(400));
    language: text/javascript
order: 6000
